name: PromiseGraph verification
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  graph-and-contract-tests:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: '6379'
      RUN_GRAPH_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: All tests including actual FalkorDB Cypher and persisted decision
        run: python -m pytest tests -q
      - name: Check JavaScript syntax
        run: node --check promisegraph/static/app.js
