name: PromiseGraph verification
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  graph-and-contract-tests:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: '6379'
      RUN_GRAPH_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: All tests including actual FalkorDB Cypher and persisted decision
        run: python -m pytest tests -q
      - name: Check JavaScript syntax and client state regressions
        run: |
          node --check promisegraph/static/app.js
          node scripts/check_client_state.cjs

      - name: Check published Render URL (not a second staging environment)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://promisegraph-graphhacks-2026.onrender.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --max-time 25 "$BASE/api/health" -o /tmp/promisegraph-health.json; then break; fi
            echo "Render Free warming up: retry $attempt" >&2
            sleep 8
          done
          curl --fail --silent --show-error --max-time 25 "$BASE/api/portfolio" -o /tmp/promisegraph-portfolio.json
          curl --fail --silent --show-error --max-time 25 "$BASE/" -o /tmp/promisegraph-ui.html
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/promisegraph-health.json').read_text())
          portfolio=json.loads(Path('/tmp/promisegraph-portfolio.json').read_text())
          ui=Path('/tmp/promisegraph-ui.html').read_text()
          assert health['source']=='real_graph' and health['nodes']>0 and health['edges']>0, health
          assert portfolio['source']=='real_falkordb' and portfolio['variants_scanned']==3,portfolio
          assert 'scanPortfolio' in ui and 'replay' in ui
          print('Live Render OK: FalkorDB graph, portfolio triage and accessible UI')
          PY


      - name: Verify published product story and competition blog
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://promisegraph-graphhacks-2026.onrender.com"
          curl --fail --silent --show-error --max-time 30 "$BASE/story" -o /tmp/promisegraph-story.html
          curl --fail --silent --show-error --max-time 30 "$BASE/article" -o /tmp/promisegraph-article.html
          python - <<'PY'
          from pathlib import Path
          story=Path('/tmp/promisegraph-story.html').read_text()
          article=Path('/tmp/promisegraph-article.html').read_text()
          assert 'PromiseGraph' in story and 'FalkorDB' in story and 'github.com/kmarahovskiy-oss/PromiseGraph-GraphHacks-2026' in story
          assert 'One Wrong Measurement, Two Broken Promises' in article and 'FalkorDB' in article
          print('Public story and published blog available over HTTPS')
          PY
